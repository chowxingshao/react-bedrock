openapi: 3.1.0
info:
  title: React Bedrock example API
  version: 1.0.0
  description: >
    Local fixture that mirrors the mock API in src/mocks.
    Replace this file (or point orval.config.ts at your backend's spec URL) for a real project.
servers:
  - url: /api
tags:
  - name: auth
  - name: items
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Signed out. }
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      responses:
        '204': { description: Session renewed. }
        '401': { $ref: '#/components/responses/Error' }
  /items:
    get:
      tags: [items]
      operationId: listItems
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 10 },
          }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ItemStatus' } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [name, price, quantity, updatedAt] },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [items]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      tags: [items]
      operationId: getItem
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [items]
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [items]
      operationId: deleteItem
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error (the error body the template assumes).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SessionUser:
      type: object
      required: [id, name, email, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        permissions: { type: array, items: { type: string } }
    ItemStatus:
      type: string
      enum: [draft, active, archived]
    ItemInput:
      type: object
      required: [name, description, status, price, quantity]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/ItemStatus' }
        price: { type: number, minimum: 0, maximum: 1000000 }
        quantity: { type: integer, minimum: 0, maximum: 1000000 }
    Item:
      allOf:
        - { $ref: '#/components/schemas/ItemInput' }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ItemList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
